<!DOCTYPE html>
<!-- PixelOrchestra — 最終更新: 2026-09-09 / v0.1 / 生成元: PixelOrchestra -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Orchestra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
  <link rel="stylesheet" href="style.css?v=20260918s">
</head>
<body>
  <div id="stageArea">
  <div id="camBar">
      <div class="camSide">
  <div class="box">
  <h3 class="hd">タイトル</h3>
  <label class="chk" title="舞台に置くタイトルのロゴを表示する"><input type="checkbox" id="showTitle" checked> 表示する</label>
  <label class="ctl" title="左右。マイナスで客席から見て左"><span>X（左右） <b data-value-for="titleX">0</b></span><input type="range" id="titleX" min="-30" max="30" step="0.5" value="0"></label>
  <label class="ctl" title="高さ"><span>Y（高さ） <b data-value-for="titleY">7</b></span><input type="range" id="titleY" min="0" max="30" step="0.5" value="7"></label>
  <label class="ctl" title="前後。大きいほど客席側（手前）"><span>Z（前後） <b data-value-for="titleZ">-12</b></span><input type="range" id="titleZ" min="-40" max="20" step="0.5" value="-12"></label>
  <label class="chk" title="ひな壇と同じ円弧に沿ってロゴを曲げる。Z を動かすと、その位置での曲がり方になる"><input type="checkbox" id="titleBend"> ひな壇の曲率で曲げる</label>
  <label class="ctl" title="大きさの倍率"><span>大きさ <b data-value-for="titleScale">1</b></span><input type="range" id="titleScale" min="0.2" max="4" step="0.05" value="1"></label>
  <label class="ctl" title="不透明度。1 で不透明、下げるほど後ろが透ける"><span>濃度 <b data-value-for="titleOpacity">1</b></span><input type="range" id="titleOpacity" min="0.05" max="1" step="0.05" value="1"></label>
  </div>
  <div class="box">
  <h3 class="hd">背景</h3>
  <!-- 上の色（bgTop）は太陽光の詳細「空の色」へ移した（2026-09-16 ユーザー指定）。時刻に追従する -->
  <!-- 下の色（bgBottom）も太陽光の詳細「地平線の色」へ移した（2026-09-16 ユーザー指定）。時刻に追従する -->
  <label class="ctl" title="上の色と下の色がちょうど半分ずつ混ざる高さ [%]。0 で上端、100 で下端"><span>中間地点 <b data-value-for="bgMid">50</b></span><input type="range" id="bgMid" min="0" max="100" step="1" value="50"></label>
  <label class="chk2" title="プレビューでの見え方だけを上下反転する（上の色・下の色・中間地点の値はそのまま）"><input type="checkbox" id="bgFlip"> 上下を反転</label>
  <label class="ctl row" title="床とひな壇の天面の絵"><span>床</span>
  <select id="floorStyle"><option value="plank">板目</option><option value="grass">草原</option></select>
  </label>
  </div>
  <div class="box credits2">
  <h3 class="hd">クレジット</h3>
  <label class="chk" title="プレビューの左下にクレジットを重ねて表示する"><input type="checkbox" id="showCredits"> 表示する</label>
  <div class="twocol">
    <div>
      <label class="ctl" title="1 行目（小さめ。原作名・シリーズ名など）"><span>1 行目</span><input type="text" id="credit1" list="creditHist1" placeholder="（例）天地創造" autocomplete="off"></label>
      <label class="ctl" title="2 行目（大きめ。曲名）"><span>2 行目</span><input type="text" id="credit2" list="creditHist2" placeholder="（例）ソレイユ" autocomplete="off"></label>
      <label class="ctl" title="作曲者。入力がある時だけ「Comp.」付きで出る"><span>作曲</span><input type="text" id="credit3" list="creditHist3" placeholder="（例）光田康典" autocomplete="off"></label>
      <label class="ctl" title="編曲者。入力がある時だけ「Arr.」付きで出る"><span>編曲</span><input type="text" id="credit4" list="creditHist4" value="Romashige" placeholder="（例）Romashige" autocomplete="off"></label>
    </div>
    <div>
      <label class="ctl" title="全体の大きさの倍率"><span>大きさ <b data-value-for="creditScale">1</b></span><input type="range" id="creditScale" min="0.4" max="2.5" step="0.05" value="1"></label>
      <label class="ctl row" title="文字の色"><span>色</span><input type="color" id="creditColor" value="#ffffff"></label>
      <label class="ctl" title="不透明度"><span>濃度 <b data-value-for="creditOpacity">0.8</b></span><input type="range" id="creditOpacity" min="0.1" max="1" step="0.05" value="0.8"></label>
    </div>
  </div>
  <datalist id="creditHist1"></datalist><datalist id="creditHist2"></datalist>
  <datalist id="creditHist3"></datalist><datalist id="creditHist4"></datalist>
  </div>
  <div class="box">
  <h3 class="hd">テンポ・拍子</h3>
  <label class="chk" title="プレビューの左上にテンポ（♩=）と拍子を重ねて表示する"><input type="checkbox" id="showTempo"> 表示する</label>
  <label class="ctl" title="文字の大きさの倍率"><span>大きさ <b data-value-for="tempoScale">1</b></span><input type="range" id="tempoScale" min="0.4" max="3" step="0.05" value="1"></label>
  <label class="ctl" title="不透明度"><span>濃度 <b data-value-for="tempoOpacity">0.9</b></span><input type="range" id="tempoOpacity" min="0.1" max="1" step="0.05" value="0.9"></label>
  </div>
      </div>
  </div>
    <!-- プレビュー：外枠（#viewWrap）＝端末の画面、内側（#view）＝実際に映る面。
         スマホ縦は内側が正方形なので、上下に黒帯が入る（2026-09-14 ユーザー指定）。
         端末の画素数どおりの大きさで置き、入り切らない時だけ #viewWrap ごと縮小する（--vzoom） -->
    <div id="viewArea">
    <div id="viewWrap">
    <div id="view">
      <!-- テンポと拍子（左上）。拍子は「今の拍／分母」で、分子が 1 2 3 4 … と進む -->
      <div id="tempoHud"><div class="bpm"></div><div class="sig"></div></div>
      <!-- クレジット（MIDIOrchestra と同じ作り：canvas の上に重ねた DOM。接頭辞付きの行は入力がある時だけ出す） -->
      <div id="credits">
        <div class="cl" data-line="1"></div>
        <div class="cl big" data-line="2"></div>
        <div class="cl" data-line="3"><span class="pre">Comp. </span><span></span></div>
        <div class="cl" data-line="4"><span class="pre">Arr. </span><span></span></div>
      </div>
    </div>
    </div>
    <!-- 端末の画面にぴったり重ねる層。位置と大きさは JS（placeOverlay）が合わせる。
         中の箱は 70% で表示する（2026-09-14 ユーザー指定） -->
    <div id="viewOverlay">
      <div id="viewLeft">
      <div class="box" id="boxRoll">
      <h3 class="hd">ピアノロール</h3>
      <label class="chk" title="流れ落ちるピアノロールを表示する"><input type="checkbox" id="showRoll" checked> 表示する</label>
      <label class="ctl" title="ノートが落ちる速さ。速いほど先読み時間が短くなる（先読み時間 = 高さ ÷ 速度）"><span>落下速度 <b data-value-for="rollSpeed">3</b></span><input type="range" id="rollSpeed" min="1" max="8" step="0.5" value="3"></label>
      <label class="ctl" title="ノートが見え始める高さ（足元から）。高いほど先の音まで見えるが、後列の奏者を隠しやすい"><span>見える高さ <b data-value-for="rollHeight">7</b></span><input type="range" id="rollHeight" min="2" max="24" step="0.5" value="7"></label>
      <label class="ctl" title="ノートの太さ（半音 1 つ分の横幅）。全パート共通。列の横幅もこれに連動して伸縮する"><span>ノート幅 <b data-value-for="noteWidth">0.22</b></span><input type="range" id="noteWidth" min="0.06" max="0.6" step="0.02" value="0.22"></label>
      <label class="ctl" title="ノートの不透明度。下げると後ろの奏者が透けて見える"><span>濃度 <b data-value-for="rollOpacity">0.85</b></span><input type="range" id="rollOpacity" min="0.1" max="1" step="0.05" value="0.85"></label>
      <label class="ctl" title="ノートの周りの光（グロー）。0 で無し。大きいほど広く・明るく滲む（ノートの色で加算合成）"><span>グロー <b data-value-for="rollGlow">0</b></span><input type="range" id="rollGlow" min="0" max="2" step="0.1" value="0"></label>
    </div>
      <div class="box" id="boxPlayer">
      <h3 class="hd">奏者</h3>
      <label class="ctl" title="音の強弱（velocity / CC）にどれだけ反応するか。前傾・頭の傾き・楽器の角度・体の膨らみ・指揮の振り幅の倍率。足元の光と拍の揺れには効かない"><span>強弱の反応 <b data-value-for="dynResponse">1</b></span><input type="range" id="dynResponse" min="0" max="3" step="0.1" value="1"></label>
      <label class="ctl" title="姿勢（前傾・膨らみ・頭の角度・体の傾き）が強弱に追いつく速さ。1 で拍の半分くらいの時間で追いつく。小さいほどゆっくり乗り、スローテンポで 1 音ごとにピクつかない。音の頭の小さな反応（うなずき・弓圧）には効かない"><span>反応の速さ <b data-value-for="dynSpeed">1</b></span><input type="range" id="dynSpeed" min="0.2" max="3" step="0.1" value="1"></label>
      <label class="ctl" title="拍に同期した体の左右の揺れの大きさ（2 拍で 1 往復・奏者ごとに位相が違う）。指揮者の振りの大きさにも少し効く"><span>体の揺れ <b data-value-for="sway">1</b></span><input type="range" id="sway" min="0" max="2" step="0.1" value="1"></label>
    </div>
      <div class="box" id="boxLabel">
      <h3 class="hd">パート名</h3>
      <label class="chk" title="各パートの頭上に名前を表示する"><input type="checkbox" id="showNames" checked> 表示する</label>
      <label class="ctl" title="文字の大きさの倍率"><span>大きさ <b data-value-for="labelSize">1</b></span><input type="range" id="labelSize" min="0.3" max="3" step="0.1" value="1"></label>
      <label class="ctl" title="黒縁の外側に付ける白縁の太さ [px]。0 で白縁なし"><span>白縁の太さ <b data-value-for="labelOutline">3</b></span><input type="range" id="labelOutline" min="0" max="8" step="0.5" value="3"></label>
      <label class="ctl" title="頭上からの高さ。プラスで上、マイナスで下へ"><span>高さ位置 <b data-value-for="labelY">0</b></span><input type="range" id="labelY" min="-2" max="6" step="0.1" value="0"></label>
    </div>
      <div class="box" id="boxGlow">
      <h3 class="hd">足元の光</h3>
      <label class="chk" title="各奏者の足元にパート色の光を出す。強さ（velocity / CC）に応じて明るくなり、指揮者は拍で明滅する"><input type="checkbox" id="showGlow" checked> 表示する</label>
      <label class="ctl" title="光の明るさの倍率"><span>濃度 <b data-value-for="glowIntensity">1</b></span><input type="range" id="glowIntensity" min="0" max="2" step="0.1" value="1"></label>
      <label class="ctl" title="光の輪郭のぼかし。0 でくっきりした円、1 で中心から外へなだらかに消える"><span>ぼかし <b data-value-for="glowSoft">0.6</b></span><input type="range" id="glowSoft" min="0" max="1" step="0.05" value="0.6"></label>
    </div>
      </div>
      <div id="viewBottom"></div>
        <div class="box autoCamBox" title="演奏会のカメラワークのように、小節の頭で自動的に構図を切り替える">
        <h3 class="hd">自動カメラ</h3>
        <label class="chk" title="オンの間はマウス操作を止める"><input type="checkbox" id="autoCam"> 自動で切り替える</label>
        <label class="ctl" title="切り替えの速さ。大きいほど短いショットになる"><span>切替の速さ <b data-value-for="camRate">1</b></span><input type="range" id="camRate" min="0.3" max="3" step="0.1" value="1"></label>
        <label class="ctl" title="アップの割合。0 で寄らない、1 でほぼアップ"><span>アップ <b data-value-for="camClose">0.6</b></span><input type="range" id="camClose" min="0" max="1" step="0.05" value="0.6"></label>
        <label class="ctl" title="ショットの間にカメラが動く量。0 で静止"><span>動きの量 <b data-value-for="camMove">0.6</b></span><input type="range" id="camMove" min="0" max="1" step="0.05" value="0.6"></label>
        <label class="ctl" title="動くショットの割合。0 で全部固定、1 で全部動く"><span>動きの頻度 <b data-value-for="camMoveFreq">0.6</b></span><input type="range" id="camMoveFreq" min="0" max="1" step="0.05" value="0.6"></label>
        </div>
    </div>
    </div>
    <!-- スクリーン（ひな壇の上に重ねる層。背景やキャラクターを映す想定）。2026-09-13 ユーザー指定 -->
    <div id="screenBar">
      <!-- 左：スカイドーム（3 層固定）／右：スクリーン。2026-09-16 ユーザー指定で別セクションに分けた -->
      <section id="domeSec">
        <div class="hd">スカイドーム</div>
        <div id="domeRows"></div>
      </section>
      <section id="screenSec">
        <div class="hd">スクリーン<button id="screenReload" title="素材フォルダを調べ直す（ファイルを増やした時）">素材の一覧を更新</button></div>
        <div id="screenRows"></div>
      </section>
    </div>
  </div>

  <header id="topbar">
    <h1>Pixel Orchestra</h1>
    <!-- ファイルは 2 段（MIDI / 音声）、その右に遅延スライダーを 2 段（2026-09-14 ユーザー指定） -->
    <div class="files">
      <div class="frow">
        <label class="filebtn" title="MIDI ファイル（.mid）を読み込む。トラック名から楽器を自動判定します">MIDI<input type="file" id="midiFile" accept=".mid,.midi,audio/midi"></label>
        <span id="status" class="status">（未読み込み）</span>
      </div>
      <div class="frow">
        <label class="filebtn" title="音声ファイル（mp3/wav/m4a・任意）。MIDI と同期して再生します。無くても動きます">音声<input type="file" id="audioFile" accept="audio/*"></label>
        <span id="audioName" class="status">（なし）</span>
      </div>
    </div>
    <div class="delays">
      <label class="dly" title="MIDI（奏者の動き・ピアノロール）を何秒遅らせるか。マイナスで早める"><span>MIDI遅延</span><input type="range" id="midiDelay" min="-2" max="3" step="0.05" value="0"><b data-value-for="midiDelay">0</b><small>秒</small></label>
      <label class="dly" title="音声を何秒遅らせるか。マイナスで早める。映像と音がずれる時に調整"><span>音声遅延</span><input type="range" id="audioDelay" min="-2" max="3" step="0.05" value="0"><b data-value-for="audioDelay">0</b><small>秒</small></label>
    </div>
    <span class="spacer"></span>
    <button id="playBtn" class="primary" title="再生／一時停止（Space キーでも可）">▶ 再生</button>
    <button id="stopBtn" title="停止して曲頭に戻る">■ 停止</button>
    <span id="timeLabel" class="time" title="現在位置 / 曲の長さ、♩= 現在のテンポ">0:00 / 0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" class="seek" title="再生位置">
    <!-- プリセット：いま保存している設定を丸ごと名前を付けて覚える（2026-09-14 ユーザー指定） -->
    <div class="preset" title="いまの設定（スライダー・スクリーン・スカイドーム・楽器の割当など保存対象の全部）に名前を付けて覚える">
      <select id="presetList" title="選ぶとその設定に切り替わる"><option value="">プリセット…</option></select>
      <input id="presetName" type="text" placeholder="名前" title="保存する名前。既にある名前なら上書き">
      <button id="presetSave" title="いまの設定をこの名前で保存（同じ名前なら上書き）">保存</button>
      <button id="presetDel" title="選んでいるプリセットを削除">削除</button>
    </div>
  </header>

  <aside id="panel">
    <!-- カメラ（位置・中心点・視点リセット・端末切替）。右メニューの一番上に固定（2026-09-16 ユーザー指定） -->
    <div id="camArea">
      <div class="camGroup">
        <div class="camCol">
        <div class="camRow">
      <div class="box" title="カメラの位置（座標）。動かすと中心点も一緒に平行移動する（回転しない）。マウスで回した時もここに反映される">
        <h3 class="hd">カメラ位置</h3>
        <div class="row3"><label class="ctl" title="左右。マイナスで客席から見て左"><span>X（左右） <b data-value-for="camX">0</b></span><input type="range" id="camX" min="-45" max="45" step="0.5" value="0"></label>
        <label class="ctl" title="高さ"><span>Y（高さ） <b data-value-for="camY">9</b></span><input type="range" id="camY" min="0.5" max="50" step="0.5" value="9"></label>
        <label class="ctl" title="前後。大きいほど客席側（手前）"><span>Z（前後） <b data-value-for="camZ">10.5</b></span><input type="range" id="camZ" min="-45" max="70" step="0.5" value="10.5"></label></div>
      </div>
      <div class="box" title="カメラが向く中心点（注視点）。ここを動かすと向きが変わる。マウス操作の回転の中心にもなる">
        <h3 class="hd">カメラ中心点</h3>
        <div class="row3"><label class="ctl" title="左右"><span>X <b data-value-for="tgtX">0</b></span><input type="range" id="tgtX" min="-30" max="30" step="0.5" value="0"></label>
        <label class="ctl" title="高さ"><span>Y <b data-value-for="tgtY">3</b></span><input type="range" id="tgtY" min="-5" max="25" step="0.1" value="3"></label>
        <label class="ctl" title="前後"><span>Z <b data-value-for="tgtZ">-12</b></span><input type="range" id="tgtZ" min="-45" max="25" step="0.5" value="-12"></label></div>
      </div>
        </div>
        <button id="resetCam" title="視点を初期位置に戻す">視点リセット</button>
        <!-- プレビューの縦横比を切り替えて、PC / スマホでの見え方を確かめる（2026-09-14 ユーザー指定） -->
        <div class="viewSize seg">
          <button id="viewFree" class="on" title="端末を指定しない（今までどおり、ブラウザの大きさに合わせて 16:9 で表示）">なし</button>
          <button id="viewPc" title="PC で見たときの画素数（1920×1080）">PC</button>
          <button id="viewPhoneV" title="スマホを縦にしたとき（論理 390×844）。映る面は正方形 390×390 で、上下は黒帯。左右に写る範囲は PC と同じ">スマホ縦</button>
          <button id="viewPhoneH" title="スマホを横にしたとき（論理 844×390）。映る面は PC と同じ 16:9 で右寄せ、左が空く">スマホ横</button>
        </div>
        </div>
      </div>
    </div>
    <hr class="sep">
    <div class="cols">
      <div class="col">
    <div class="box" id="lightBox">
      <h3 class="hd">照明</h3>
      <label class="ctl" title="露出（全体の明るさ）。明るい部分（輝度 0.8 以上）は白飛びしないよう自動で圧縮される（色・彩度は保つ）"><span>露出 <b data-value-for="exposure">1</b></span><input type="range" id="exposure" min="0.3" max="2.5" step="0.05" value="1"></label>
      <!-- 光源の切替（2026-09-16 ユーザー指定）。屋内のスポットライトと屋外の太陽光は併用せず、どちらか一方。
           選んでいない方の値も消さずに残す（切り替え戻せば元どおり）。ラジオなので設定の自動保存に乗る -->
      <div class="seg" title="光源。屋内はスポットライト、屋外は太陽光">
        <label><input type="radio" name="lightMode" value="spot" checked>スポットライト</label>
        <label><input type="radio" name="lightMode" value="sun">太陽光</label>
      </div>
      <fieldset class="sub" id="spotSet" title="客席側の上手・下手から舞台中央を照らすスポットライト 2 灯">
        <legend>スポットライト（2 灯）</legend>
        <label class="ctl" title="環境光（ホールの壁や床からの跳ね返り光の近似）の強さ。影の中の明るさが変わる。小さいほど影が濃い"><span>環境光 <b data-value-for="ambient">0.7</b></span><input type="range" id="ambient" min="0" max="1.5" step="0.05" value="0.7"></label>
        <label class="ctl" title="スポットライトの強さ"><span>強さ <b data-value-for="spotIntensity">1.6</b></span><input type="range" id="spotIntensity" min="0" max="4" step="0.1" value="1.6"></label>
        <label class="ctl" title="仰角 [度]。舞台中心から見た光源の高さ。小さいほど低い位置から浅い角度で当たり影が長い、90 で真上"><span>仰角 <b data-value-for="spotElev">40</b></span><input type="range" id="spotElev" min="10" max="90" step="5" value="40"></label>
        <label class="ctl" title="2 灯の左右の開き [度]。客席正面から左右に何度ずつ離れた位置に置くか。0 で正面 1 灯分、90 で真横"><span>左右の開き <b data-value-for="spotSpread">30</b></span><input type="range" id="spotSpread" min="0" max="90" step="5" value="30"></label>
        <label class="ctl" title="光の円錐の広がり（半頂角）[度]。小さいと中央だけ、大きいと舞台全体"><span>広がり <b data-value-for="spotCone">30</b></span><input type="range" id="spotCone" min="10" max="60" step="2" value="30"></label>
        <label class="ctl" title="円錐の輪郭のぼけ。0 で境界がくっきり、1 で中心から外へなだらかに消える"><span>ぼけ <b data-value-for="spotBlur">0.5</b></span><input type="range" id="spotBlur" min="0" max="1" step="0.05" value="0.5"></label>
      </fieldset>
      <fieldset class="sub" id="sunSet" title="屋外の太陽光（平行光）。時刻と天気から物理的に決める（北緯 35°・春秋分）。手動にすると方角・高度・色温度・強さを直接決められる">
        <legend>太陽光</legend>
        <!-- 自動（時刻 × 天気 × 舞台の向き。2026-09-16 ユーザー指定：物理に基づく案 B）。手動チェックでこの 3 つは隠れ、下の詳細が出る -->
        <div id="sunAutoSet">
        <label class="ctl" title="時刻 [時]。小数は分（12.5 = 12:30）。5:00〜19:00。太陽の高度と方角、色温度、強さがここから決まる。日の出前・日没後は直射が消えて空の明るさだけ残る（薄明）"><span>時刻 <b data-value-for="sunHour">12</b></span><input type="range" id="sunHour" min="5" max="19" step="0.25" value="12"></label>
        <label class="ctl" title="雲量。0 で快晴（直射が強く影がくっきり）、1 で曇天（直射と影が消え、空全体からの青白い光だけになる）"><span>天気（雲量） <b data-value-for="sunCloud">0</b></span><input type="range" id="sunCloud" min="0" max="1" step="0.05" value="0"></label>
        <label class="ctl" title="舞台が向いている方位 [度]（客席がある方角）。0 北・90 東・180 南・270 西。南向き（既定）だと太陽は客席から見て右（東）から昇り、左（西）へ沈む"><span>舞台の向き <b data-value-for="stageFacing">180</b></span><input type="range" id="stageFacing" min="0" max="345" step="15" value="180"></label>
        </div>
        <label class="chk2" title="時刻・天気から決めるのをやめて、下の詳細を直接決める。外している間は詳細に計算値が入って追従する"><input type="checkbox" id="sunManual"> 詳細を手動で</label>
        <!-- 詳細は常に表示。自動のときは計算値が入って追従し、触れない（2026-09-16 ユーザー指定） -->
        <div id="sunManualSet">
        <label class="ctl" title="太陽光（直射）の強さ"><span>強さ <b data-value-for="sunIntensity">1.2</b></span><input type="range" id="sunIntensity" min="0" max="4" step="0.01" value="1.2"></label>
        <label class="ctl" title="方角 [度]。舞台中心から見て太陽がどちらにあるか。0 で客席正面、90 で客席から見て右、180 で舞台の奥、270 で左"><span>方角 <b data-value-for="sunAzimuth">30</b></span><input type="range" id="sunAzimuth" min="0" max="360" step="1" value="30"></label>
        <label class="ctl" title="高度 [度]。太陽の高さ。小さいほど朝夕の低い光で影が長い、90 で真上。0 以下は地平線下（直射なし）"><span>高度 <b data-value-for="sunElev">55</b></span><input type="range" id="sunElev" min="-15" max="90" step="1" value="55"></label>
        <label class="ctl" title="色温度。0 で朝夕の橙、0.5 で昼の白、1 で曇り空の青"><span>色温度 <b data-value-for="sunTemp">0.5</b></span><input type="range" id="sunTemp" min="0" max="1" step="0.01" value="0.5"></label>
        <label class="ctl row" title="空の色（背景の上端の色。天空光の色みにも使う）。自動では時刻と天気から決まる：昼の青 → 夕方の深い青紫 → 日没後の紺 → 夜の黒、雲が多いほど灰色"><span>空の色</span><input type="color" id="bgTop" value="#0058ff"></label>
        <label class="ctl row" title="地平線の色（背景の下端の色）。自動では時刻と天気から決まる：昼の淡い水色 → 日没前の薄黄 → 日没の橙 → ピンク → 紫 → 濃紺。薄雲で派手に、厚い雲で灰色"><span>地平線の色</span><input type="color" id="bgBottom" value="#bfe0f5"></label>
        <label class="ctl" title="天空光（空全体からの拡散光）の強さ。影の中の明るさ。曇りほど強く、直射の代わりになる"><span>天空光 <b data-value-for="sunAmbient">0.7</b></span><input type="range" id="sunAmbient" min="0" max="3" step="0.01" value="0.7"></label>
        </div>
        <!-- 空の色は背景の「上の色」（上下反転中は「下の色」）、地面の色は床の絵の平均色を自動で使う（2026-09-16 ユーザー指定） -->
      </fieldset>
    </div>
    



      </div>
      <div class="col">
    <div class="box">
      <h3 class="hd">スペクトラム</h3>
      <label class="chk" title="読み込んだ音声の周波数を、タイトルの周りにバーで出す"><input type="checkbox" id="showSpectrum"> 表示する</label>
      <div class="ctl radio" title="円：タイトルを囲む円の上に並べる。ロゴに沿う：ロゴの輪郭から外向きに線が出る"><span>形</span>
        <label><input type="radio" name="specMode" value="circle" checked> 円</label>
        <label><input type="radio" name="specMode" value="logo"> ロゴに沿う</label>
      </div>
      <label class="ctl" title="バーの本数"><span>本数 <b data-value-for="specBars">64</b></span><input type="range" id="specBars" min="16" max="160" step="4" value="64"></label>
      <label class="ctl" title="円の半径（タイトルの中心から）。「ロゴに沿う」では使わない"><span>半径 <b data-value-for="specRadius">4</b></span><input type="range" id="specRadius" min="1" max="15" step="0.25" value="4"></label>
      <label class="ctl" title="音が大きい時のバーの長さ"><span>長さ <b data-value-for="specHeight">2.5</b></span><input type="range" id="specHeight" min="0.2" max="10" step="0.1" value="2.5"></label>
      <label class="ctl" title="バーの太さ（隣との間隔に対する割合）"><span>太さ <b data-value-for="specWidth">1</b></span><input type="range" id="specWidth" min="0.2" max="3" step="0.1" value="1"></label>
      <label class="ctl" title="明るさ（加算合成なので重なると明るくなる）"><span>濃度 <b data-value-for="specOpacity">0.9</b></span><input type="range" id="specOpacity" min="0.1" max="1" step="0.05" value="0.9"></label>
      <label class="ctl row" title="バーの色"><span>色</span><input type="color" id="specColor" value="#9fd8ff"></label>
    </div>
      </div>
    </div>
  </aside>

  <aside id="panelRight">
    <h3 class="hd" title="楽器・音域（キースイッチ除外）・強弱の情報源・統合をトラックごとに設定。設定はトラック名ごとに記憶されます">トラック</h3>
    <table class="tracks">
      <thead><tr><th></th><th title="MIDI のトラック名。↳ は他のトラックに統合されているもの">名前</th><th title="ノートの数。除外がある時は「表示／全体」">音数</th><th title="このトラックを演奏する楽器（絵・動き・配置）">楽器</th></tr></thead>
      <tbody id="trackRows"></tbody>
    </table>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.min.js"></script>
