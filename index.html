<!DOCTYPE html>
<!-- PixelOrchestra — 最終更新: 2026-09-09 / v0.1 / 生成元: PixelOrchestra -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Orchestra</title>
  <link rel="stylesheet" href="style.css?v=20260909b">
</head>
<body>
  <div id="view"></div>

  <button id="panelToggle" title="パネルの表示/非表示">☰</button>

  <aside id="panel">
    <h1>Pixel Orchestra</h1>
    <p class="hint">MIDI を読み込むとドット絵の楽団が演奏します。ドラッグで視点を回転、ホイールでズーム。</p>

    <label class="file">
      <span>MIDI ファイル</span>
      <input type="file" id="midiFile" accept=".mid,.midi,audio/midi">
    </label>
    <div id="status" class="status">（未読み込み）</div>

    <label class="file">
      <span>音声ファイル（任意・MIDI と同期再生）</span>
      <input type="file" id="audioFile" accept="audio/*">
    </label>
    <div id="audioName" class="status">（音声なしでも動きます）</div>

    <div class="row">
      <button id="playBtn" class="primary">▶ 再生</button>
      <button id="stopBtn">■ 停止</button>
      <span id="timeLabel" class="time">0:00 / 0:00</span>
    </div>
    <input type="range" id="seek" min="0" max="1000" value="0" class="seek">

    <details open>
      <summary>設定</summary>
      <label class="ctl"><span>音声オフセット (ms)</span><input type="number" id="audioOffset" value="0" step="10"></label>
      <label class="ctl"><span>ロール落下速度 <b data-value-for="rollSpeed">3</b></span><input type="range" id="rollSpeed" min="1" max="8" step="0.5" value="3"></label>
      <label class="ctl"><span>ロールの高さ（頭上モード） <b data-value-for="rollHeight">7</b></span><input type="range" id="rollHeight" min="2" max="24" step="0.5" value="7"></label>
      <label class="ctl"><span>ノート幅（半音あたり） <b data-value-for="noteWidth">0.22</b></span><input type="range" id="noteWidth" min="0.06" max="0.6" step="0.02" value="0.22"></label>
      <label class="ctl"><span>体の揺れ <b data-value-for="sway">1</b></span><input type="range" id="sway" min="0" max="2" step="0.1" value="1"></label>
      <label class="chk"><input type="checkbox" id="showRoll" checked> ピアノロールを表示</label>
      <label class="ctl"><span>ロールの位置</span>
        <select id="rollMode">
          <option value="overhead" selected>各奏者の頭上に落ちる</option>
          <option value="wall">後方の壁に流れる</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="showGlow" checked> 足元の光を表示</label>
      <label class="chk"><input type="checkbox" id="showNames" checked> パート名を表示</label>
      <button id="resetCam">視点をリセット</button>
    </details>

    <details open>
      <summary>トラック（楽器の割当）</summary>
      <table class="tracks">
        <thead><tr><th></th><th>名前</th><th>音数</th><th>楽器</th></tr></thead>
        <tbody id="trackRows"></tbody>
      </table>
    </details>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.min.js"></script>
  <script type="module" src="src/main.js?v=20260909m"></script>
</body>
</html>
