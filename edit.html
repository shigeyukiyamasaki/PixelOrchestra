<!DOCTYPE html>
<!-- PixelOrchestra — 衣装のボクセル編集。最終更新: 2026-09-21 / v0.1 / 生成元: PixelOrchestra
     髪型などの細部は言葉で伝えるのが難しいので、ここで直接いじって保存する（2026-09-21 ユーザー指定）。
     保存先は assets/voxel/<部位のキー>.json。本体（index.html）は起動時に GET /voxels.json で読み、
     手続き的に作る形の代わりに使う。 -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Orchestra — 衣装の編集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
  <style>
    :root { --bg:#12131a; --panel:#1c1e28; --line:#2e3242; --fg:#e8ecf4; --dim:#9aa3b8; --accent:#4a9eff; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
                 font-family:'DotGothic16', system-ui, sans-serif; overflow:hidden; }
    #app { display:grid; grid-template-columns:200px 1fr 220px; height:100%; }
    aside { background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:10px; }
    aside.right { border-right:none; border-left:1px solid var(--line); }
    h2 { font-size:13px; margin:0 0 8px; color:var(--dim); font-weight:normal; letter-spacing:.08em; }
    h2:not(:first-child) { margin-top:16px; }
    .part { display:block; width:100%; text-align:left; background:transparent; color:var(--fg);
            border:1px solid transparent; border-radius:5px; padding:6px 8px; font:inherit; font-size:13px; cursor:pointer; }
    .part:hover { background:#252838; }
    .part.on { background:#2b3550; border-color:var(--accent); }
    .part .mark { color:var(--accent); font-size:11px; margin-left:4px; }
    #view { position:relative; background:#0e1016; }
    #view canvas { display:block; }
    #hud { position:absolute; left:12px; top:10px; font-size:12px; color:var(--dim); line-height:1.7;
           pointer-events:none; text-shadow:0 1px 2px #000; }
    #msg { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); font-size:13px;
           background:#000a; padding:6px 14px; border-radius:6px; opacity:0; transition:opacity .2s; }
    #msg.show { opacity:1; }
    .tool { display:inline-block; width:calc(33.33% - 4px); text-align:center; background:#252838; color:var(--fg);
            border:1px solid var(--line); border-radius:5px; padding:7px 0; font:inherit; font-size:12px; cursor:pointer; }
    .tool.on { background:#2b3550; border-color:var(--accent); color:#fff; }
    .swatches { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }
    .sw { aspect-ratio:1; border:2px solid transparent; border-radius:4px; cursor:pointer; padding:0; }
    .sw.on { border-color:#fff; }
    .row { display:flex; align-items:center; gap:6px; margin:8px 0; font-size:12px; color:var(--dim); }
    .row input[type=color] { width:34px; height:26px; padding:0; border:1px solid var(--line); background:none; border-radius:4px; }
    button.big { width:100%; padding:9px; margin-top:8px; font:inherit; font-size:13px; border-radius:6px;
                 border:1px solid var(--line); background:#252838; color:var(--fg); cursor:pointer; }
    button.big.save { background:#1d4e89; border-color:#2f6fc0; color:#fff; }
    button.big.reset { background:#4a2230; border-color:#7a3547; }
    button.big:disabled { opacity:.45; cursor:default; }
    a.back { color:var(--dim); font-size:12px; text-decoration:none; display:inline-block; margin-top:14px; }
    a.back:hover { color:var(--fg); }
    label.chk { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); margin:8px 0; cursor:pointer; }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <h2>部位</h2>
      <div id="partList"></div>
      <a class="back" href="index.html">← 本体へ戻る</a>
    </aside>

    <div id="view">
      <div id="hud"></div>
      <div id="msg"></div>
    </div>

    <aside class="right">
      <h2>道具</h2>
      <div>
        <button class="tool on" data-tool="erase">削る</button
        ><button class="tool" data-tool="add">足す</button
        ><button class="tool" data-tool="paint">塗る</button>
      </div>
      <div class="row">Alt+クリックで色を吸う</div>

      <div class="row" style="margin-bottom:2px">筆の大きさ（[ ] で増減）</div>
      <div>
        <button class="tool on" data-brush="1">1</button
        ><button class="tool" data-brush="2">2</button
        ><button class="tool" data-brush="4">4</button>
      </div>
      <div class="row">2 以上は「その倍数」に吸着。解像度を倍にしたあと、元の粒で描ける</div>

      <h2>色</h2>
      <div class="swatches" id="swatches"></div>
      <div class="row">
        <input type="color" id="newColor" value="#ffffff">
        <button class="tool" id="addSwatchBtn" style="width:auto;padding:7px 12px">この色を追加</button>
      </div>
      <div class="row" id="palNote"></div>
      <button class="big" id="dropUnusedBtn">未使用の色を消す</button>

      <h2>表示</h2>
      <div class="row" style="margin-bottom:2px">相方の部位（顔↔髪）　p で切替</div>
      <div>
        <button class="tool" data-pair="off">出さない</button
        ><button class="tool on" data-pair="ghost">薄く</button
        ><button class="tool" data-pair="solid">くっきり</button>
      </div>
      <div class="row" id="pairNote"></div>
      <label class="chk"><input type="checkbox" id="showGrid" checked> 床のマス目</label>

      <h2>解像度</h2>
      <button class="big" id="upscaleBtn">解像度を倍にする</button>
      <div class="row" id="resNote"></div>

      <h2>背面</h2>
      <button class="big" id="bakeBackBtn">背面の色置換を焼き込んで解除</button>
      <div class="row" id="backNote"></div>

      <h2>保存</h2>
      <button class="big save" id="saveBtn">保存する</button>
      <button class="big" id="undoBtn">元に戻す（Cmd+Z）</button>
      <button class="big" id="redoBtn">やり直す（Cmd+Shift+Z）</button>
      <button class="big reset" id="resetBtn">編集を捨てて元の形へ</button>
      <div class="row" id="stat"></div>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script type="module" src="src/voxelEdit.js?v=20260922d"></script>
</body>
</html>
